name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python import job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile init_db.py main.py

      - name: Create database and check tables
        env:
          DB_PATH: /tmp/test.db
        run: |
          python init_db.py
          python -c "
          import sqlite3
          tables = {r[0] for r in sqlite3.connect('/tmp/test.db').execute(\"SELECT name FROM sqlite_master WHERE type='table'\")}
          expected = {'Linie', 'Station', 'Linie_Station', 'Fahrt', 'Abfahrt', 'API_Abruf'}
          missing = expected - tables
          assert not missing, f'Missing tables: {missing}'
          print('All tables exist:', sorted(tables))
          "

  api:
    name: API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Start API with an empty database
        env:
          DB_PATH: /tmp/test.db
        run: |
          python3 init_db.py
          node backend/server.js > server.log 2>&1 &
          sleep 3

      - name: Check endpoints
        run: |
          curl -fsS http://localhost:3000/api/health | grep '"status":"ok"'
          for endpoint in dashboard lines stations allstations delay-by-hour line-ranking mode-stats; do
            curl -fsS -o /dev/null "http://localhost:3000/api/$endpoint" && echo "OK  /api/$endpoint"
          done
          curl -fsS -o /dev/null http://localhost:3000/ && echo "OK  frontend"

      - name: Show server log on failure
        if: failure()
        run: cat server.log

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python, api]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
